services:
  urdu-ner:
    build: .
    ports:
      - "${HOST_PORT:-8005}:8005"
    env_file:
      - .env
    environment:
      PORT: "8005"
    volumes:
      - ner_cache:/app/cache
      - ner_results:/app/results
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ner_cache:
  ner_results:
